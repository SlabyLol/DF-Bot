# GitHub App Manifest for DF-Bot
# This file is used when registering the app the first time.

# Name of the GitHub App
name: DF-Bot

# Description
description: DF-Bot helps manage and automate your GitHub projects.

# Homepage
url: https://github.com/SlabyLol/DF-Bot

# Public app (set to false if you want it private)
public: false

# Default events the app subscribes to
default_events:
  - issues
  - issue_comment
  - pull_request
  - push

# Permissions the app needs
default_permissions:
  # Repository contents
  contents: read
  # Issues
  issues: write
  # Pull requests
  pull_requests: write
  # Metadata (required)
  metadata: read
