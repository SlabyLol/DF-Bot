features:
  welcome_issues: true
  welcome_pull_requests: true
  help_command: true
  label_command: true
  unlabel_command: true
  close_command: true
  reopen_command: true
  assign_command: true
  unassign_command: true
  auto_labels: true
  auto_assign: true
  lock_command: true
  unlock_command: true
  title_command: true
  milestone_command: true
  create_file_command: true
  update_file_command: true
  delete_file_command: true
  create_branch_command: true
  create_pr_command: true
  bump_version_command: true
  run_command: true
  auto_check: true

contributor_only:
  - close
  - reopen
  - lock
  - unlock
  - create-file
  - update-file
  - delete-file
  - create-branch
  - create-pr
  - bump
  - run
  - assign
  - unassign
  - label
  - unlabel
  - title
  - milestone

auto_check:
  enabled: true
  on_issue_open: true
  on_pr_open: true
  required_files:
    - README.md
    - package.json
    - df-bot.yml
    - action.js

messages:
  issue_opened: |
    👋 Thanks for opening this issue!

    I'm **DF-B0T** and I help manage this project.
    Type `@DF-B0T help` to see all available commands.
  pull_request_opened: |
    🚀 Thanks for the pull request!

    **DF-B0T** is watching. Please keep CI green.
    Type `@DF-B0T help` for commands.

commands:
  help:
    response: |
      ### 🤖 DF-B0T – All Commands

      **Public**
      - `@DF-B0T help` → Show this help
      - `@DF-B0T check` → Run file auto-check

      **Contributors only**
      - Labels / assign / close / lock / title / milestone
      - Files: create-file, update-file, delete-file
      - Git: create-branch, create-pr, bump

      **Run any command** (contributors only)
      ```
      @DF-B0T run <command> /Z/ <name> /P/ file1 file2
      ```

auto_labels:
  bug:
    - bug
    - error
    - crash
    - broken
    - exception
  enhancement:
    - feature
    - enhancement
    - improvement
    - request
  documentation:
    - docs
    - documentation
    - readme
  question:
    - question
    - how
    - why
    - help

auto_assign:
  enabled: true
  strategy: round_robin
  assignees:
    - SlabyLol
  only_labels: []
  ignore_labels:
    - wip
    - draft

project:
  name: DF-Bot
  description: GitHub Bot for automated project management
  instructions: |
    - Always reply in English
    - Be short, clear and helpful
