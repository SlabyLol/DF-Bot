# =====================================================
# DF-Bot – Full Configuration
# =====================================================

features:
  welcome_issues: true
  welcome_pull_requests: true
  help_command: true
  label_command: true
  unlabel_command: true
  close_command: true
  reopen_command: true
  assign_command: true
  unassign_command: true
  auto_labels: true
  auto_assign: true
  lock_command: true
  unlock_command: true
  title_command: true
  milestone_command: true
  # Commit features
  create_file_command: true
  update_file_command: true
  delete_file_command: true
  create_branch_command: true
  create_pr_command: true
  bump_version_command: true

messages:
  issue_opened: |
    👋 Thanks for opening this issue!

    I'm **DF-Bot** and I help manage this project.
    Type `@df-bot help` to see all available commands.
  pull_request_opened: |
    🚀 Thanks for the pull request!

    **DF-Bot** is watching. Please keep CI green.
    Type `@df-bot help` for commands.

commands:
  help:
    response: |
      ### 🤖 DF-Bot – All Commands

      **Labels**
      - `@df-bot label <name>` → Add a label
      - `@df-bot unlabel <name>` → Remove a label

      **Assignment**
      - `@df-bot assign <username>` → Assign someone
      - `@df-bot assign me` → Assign yourself
      - `@df-bot unassign <username>` → Remove assignee
      - `@df-bot unassign me` → Unassign yourself

      **Status**
      - `@df-bot close` → Close
      - `@df-bot reopen` → Reopen
      - `@df-bot lock` → Lock comments
      - `@df-bot unlock` → Unlock comments

      **Title & Milestone**
      - `@df-bot title <new title>` → Change title
      - `@df-bot milestone <name>` → Set milestone

      **Commits & Files**
      - `@df-bot create-file <path> | <content>` → Create file + commit
      - `@df-bot update-file <path> | <content>` → Update file + commit
      - `@df-bot delete-file <path>` → Delete file + commit
      - `@df-bot create-branch <name>` → Create branch
      - `@df-bot create-pr <title>` → Create Pull Request
      - `@df-bot bump patch|minor|major` → Bump version in package.json

      **Help**
      - `@df-bot help` → Show this help

auto_labels:
  bug:
    - bug
    - error
    - crash
    - broken
    - exception
  enhancement:
    - feature
    - enhancement
    - improvement
    - request
  documentation:
    - docs
    - documentation
    - readme
  question:
    - question
    - how
    - why
    - help

auto_assign:
  enabled: true
  strategy: round_robin
  assignees:
    - SlabyLol
  only_labels: []
  ignore_labels:
    - wip
    - draft

project:
  name: DF-Bot
  description: GitHub Bot for automated project management with commit support
  instructions: |
    - Always reply in English
    - Be short, clear and helpful
