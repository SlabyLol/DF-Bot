# =====================================================
# DF-Bot – Full Configuration
# =====================================================
# Put this file in the root of your repository.
# Everything is controlled here.

# -------------------- Features --------------------
features:
  welcome_issues: true
  welcome_pull_requests: true
  help_command: true
  label_command: true
  unlabel_command: true
  close_command: true
  reopen_command: true
  assign_command: true
  unassign_command: true
  auto_labels: true
  auto_assign: true
  lock_command: true
  unlock_command: true
  title_command: true
  milestone_command: true

# -------------------- Messages --------------------
messages:
  issue_opened: |
    👋 Danke für das Issue!

    Ich bin **DF-Bot** und helfe bei diesem Projekt.
    Tippe `@df-bot help` um alle Befehle zu sehen.
  pull_request_opened: |
    🚀 Danke für den Pull Request!

    **DF-Bot** schaut drüber. Bitte CI grün halten.
    Tippe `@df-bot help` für Befehle.

# -------------------- Commands --------------------
commands:
  help:
    response: |
      ### 🤖 DF-Bot – Alle Befehle

      **Labels**
      - `@df-bot label <name>` → Label hinzufügen
      - `@df-bot unlabel <name>` → Label entfernen

      **Zuweisung**
      - `@df-bot assign <username>` → jemanden zuweisen
      - `@df-bot assign me` → dich selbst zuweisen
      - `@df-bot unassign <username>` → Zuweisung entfernen
      - `@df-bot unassign me` → dich selbst entfernen

      **Status**
      - `@df-bot close` → Issue/PR schließen
      - `@df-bot reopen` → wieder öffnen
      - `@df-bot lock` → Kommentare sperren
      - `@df-bot unlock` → Kommentare entsperren

      **Sonstiges**
      - `@df-bot title <neuer Titel>` → Titel ändern
      - `@df-bot milestone <name>` → Milestone setzen
      - `@df-bot help` → diese Hilfe anzeigen

# -------------------- Auto Labels --------------------
# Wenn der Titel eines dieser Wörter enthält → Label wird gesetzt
auto_labels:
  bug:
    - bug
    - error
    - crash
    - broken
    - fehler
    - exception
  enhancement:
    - feature
    - enhancement
    - improvement
    - request
    - wunsch
    - verbesserung
  documentation:
    - docs
    - documentation
    - readme
    - dokumentation
  question:
    - question
    - frage
    - how
    - warum
    - wieso
  good first issue:
    - beginner
    - easy
    - first issue
    - einsteiger

# -------------------- Auto Assign --------------------
# Automatische Zuweisung bei neuen Issues / PRs
auto_assign:
  enabled: true
  # Mögliche Strategien: "round_robin", "random", "all"
  strategy: round_robin
  # Liste der Personen, die zugewiesen werden können
  assignees:
    - SlabyLol
  # Nur bei bestimmten Labels zuweisen (leer = immer)
  only_labels: []
  # Bei diesen Labels NIEMALS auto-assignen
  ignore_labels:
    - wip
    - draft

# -------------------- Project Info --------------------
project:
  name: DF-Bot
  description: GitHub Bot für automatisierte Projektverwaltung
  instructions: |
    - Antworte immer auf Deutsch wenn der User Deutsch schreibt
    - Sei kurz, klar und hilfreich
    - Nutze Emojis sparsam aber sinnvoll
