# =====================================================
# DF-Bot – Full Configuration
# =====================================================
# Put this file in the root of your repository.
# Everything is controlled here.

# -------------------- Features --------------------
features:
  welcome_issues: true
  welcome_pull_requests: true
  help_command: true
  label_command: true
  unlabel_command: true
  close_command: true
  reopen_command: true
  assign_command: true
  unassign_command: true
  auto_labels: true
  auto_assign: true
  lock_command: true
  unlock_command: true
  title_command: true
  milestone_command: true

# -------------------- Messages --------------------
messages:
  issue_opened: |
    👋 Thanks for opening this issue!

    I'm **DF-Bot** and I help manage this project.
    Type `@df-bot help` to see all available commands.
  pull_request_opened: |
    🚀 Thanks for the pull request!

    **DF-Bot** is watching. Please keep CI green.
    Type `@df-bot help` for commands.

# -------------------- Commands --------------------
commands:
  help:
    response: |
      ### 🤖 DF-Bot – All Commands

      **Labels**
      - `@df-bot label <name>` → Add a label
      - `@df-bot unlabel <name>` → Remove a label

      **Assignment**
      - `@df-bot assign <username>` → Assign someone
      - `@df-bot assign me` → Assign yourself
      - `@df-bot unassign <username>` → Remove assignee
      - `@df-bot unassign me` → Unassign yourself

      **Status**
      - `@df-bot close` → Close the issue/PR
      - `@df-bot reopen` → Reopen the issue/PR
      - `@df-bot lock` → Lock comments
      - `@df-bot unlock` → Unlock comments

      **Other**
      - `@df-bot title <new title>` → Change the title
      - `@df-bot milestone <name>` → Set a milestone
      - `@df-bot help` → Show this help

# -------------------- Auto Labels --------------------
# When the title contains one of these words → label is added
auto_labels:
  bug:
    - bug
    - error
    - crash
    - broken
    - exception
  enhancement:
    - feature
    - enhancement
    - improvement
    - request
  documentation:
    - docs
    - documentation
    - readme
  question:
    - question
    - how
    - why
    - help
  good first issue:
    - beginner
    - easy
    - first issue
    - good first issue

# -------------------- Auto Assign --------------------
auto_assign:
  enabled: true
  # Strategies: "round_robin", "random", "all"
  strategy: round_robin
  assignees:
    - SlabyLol
  only_labels: []
  ignore_labels:
    - wip
    - draft

# -------------------- Project Info --------------------
project:
  name: DF-Bot
  description: GitHub Bot for automated project management
  instructions: |
    - Always reply in English
    - Be short, clear and helpful
    - Use emojis sparingly but meaningfully
